<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Fetcher</title>
    <!-- Include Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Light background */
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="50%" x="50%" dominant-baseline="middle" text-anchor="middle" font-size="100" opacity="0.5">🦟</text></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }
        
        .large-symbol {
            font-size: 3rem; /* Adjust size as needed */
        }

    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="container text-center">
        <div class="row flex-column align-items-center text-center">
            <div class="mb-2">
                <span id="light" class="badge bg-primary fs-5">Loading...</span>
            </div>
            <div class="mb-2">
                <span class="large-symbol">+</span>
            </div>
            <div class="mb-2">
                <input id="threshold-slider" type="range" min="1" max="1024" step="1" value="256" class="form-range w-100">
                <span id="threshold-value" class="badge bg-primary fs-5">Loading...</span>
            </div>
            <div class="mb-2">
                <span class="large-symbol">↓</span>
            </div>
            <div class="mb-2">
                <span id="mode" class="badge bg-primary fs-5">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Include Bootstrap JS (optional, for components like modals) -->
    <script src="/js/bootstrap.min.js"></script>
    <script>
        async function fetchStatus() {
            const modeElement = document.getElementById('mode');
            const lightElement = document.getElementById('light');
            const thresholdSlider = document.getElementById('threshold-slider');
            const thresholdValueElement = document.getElementById('threshold-value');

            // Initialize variables with default values
            let modeData = "dead?";
            let lightData = "?";
            let thresholdData = "?";

            try {
                // Fetch mode value
                const modeResponse = await fetch('/mode');
                if (modeResponse.ok) {
                    const modeValue = await modeResponse.text();
                    modeData = modeValue.trim() === "0" ? "sleeping" : "hunting";
                }

                // Fetch light value
                const lightResponse = await fetch('/light');
                if (lightResponse.ok) {
                    lightData = await lightResponse.text();
                }

                // Fetch threshold value
                const thresholdResponse = await fetch('/threshold');
                if (thresholdResponse.ok) {
                    thresholdData = await thresholdResponse.text();
                    thresholdSlider.value = thresholdData;
                }
            } catch (error) {
                console.error('Fetch error:', error);
            }

            // Update the elements with the fetched or default values
            modeElement.textContent = modeData;
            lightElement.textContent = lightData;
            thresholdValueElement.textContent = thresholdData; 
        }

        async function postThreshold(value) {
            try {
                const response = await fetch(`/threshold?value=${encodeURIComponent(value)}`);
                if (!response.ok) {
                    console.error('Failed to set threshold value');
                }
            } catch (error) {
                console.error('Error setting threshold value:', error);
            }
        }

        function updateSliderColor(value) {
            const min = 1;
            const max = 1024;
            const percent = (value - min) / (max - min);

            // Daylight warm yellow
            const r1 = 255, g1 = 230, b1 = 128;
            // Night blue/black
            const r2 = 16, g2 = 24, b2 = 64;

            // Linear interpolation
            const r = Math.round(r1 + (r2 - r1) * percent);
            const g = Math.round(g1 + (g2 - g1) * percent);
            const b = Math.round(b1 + (b2 - b1) * percent);

            const color = `rgb(${r},${g},${b})`;
            thresholdSlider.style.background = color;
        }

        // Event listener for slider changes
        const thresholdSlider = document.getElementById('threshold-slider');

        thresholdSlider.addEventListener('input', (event) => {
            const value = event.target.value;
            thresholdValueElement.textContent = value; // Update displayed value
            postThreshold(value); // Post the new value
            updateSliderColor(value); // Update color
        });

        const thresholdValueElement = document.getElementById('threshold-value');
        thresholdSlider.addEventListener('input', (event) => {
            const value = event.target.value;
            thresholdValueElement.textContent = value; // Update displayed value
            postThreshold(value); // Post the new value
        });

        setInterval(fetchStatus, 1000); // Fetch status every second
    </script>
</body>
</html>
