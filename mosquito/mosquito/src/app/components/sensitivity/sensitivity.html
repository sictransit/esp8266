<div style="display: flex; align-items: center; gap: 1em; ">
  <mat-slider 
    style="width: 100%;"
    min="0" 
    max="100"
    step="10"    
    ticks
    thumbLabel
    discrete
    [(ngModel)]="sensitivityLevel"
    (change)="onSliderChange($event)"
  ><input matSliderThumb [(ngModel)]="sensitivityLevel" #slider></mat-slider>  
</div>
